name: Third Workflow
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Greeting message
              run: echo "Welcome to build Job!"
    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Greeting message
              run: echo "Welcome to test Job!"
    lint:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Greeting message
              run: echo "Welcome to lint Job!"
    notify:
        runs-on: ubuntu-latest
        needs: [test, lint]
        steps:
            - name: Greeting message
              run: echo "Welcome to notify Job!"